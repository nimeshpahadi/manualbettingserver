name: Build and Deploy BetStream
on:
  push:
    branches:
      - master
env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build and push backend
        run: |
          docker build -t betstream-backend .
          docker tag betstream-backend \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/betstream-backend:latest
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/betstream-backend:latest
      - name: Build and push frontend
        run: |
          docker build -t betstream-frontend -f betting-frontend/Dockerfile .
          docker tag betstream-frontend \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/betstream-frontend:latest
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/betstream-frontend:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-southeast-2 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com
            cd ~
            docker-compose pull
            docker-compose down
            docker-compose up -d
            echo "✅ Deployment complete!"
